<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Google Flights 搜尋結果</title>
  <style>
    :root{font-family:Arial,"Noto Sans TC",sans-serif;color:#202124;background:#fff;--blue:#1a73e8;--light-blue:#e8f0fe;--border:#dadce0;--muted:#5f6368}*{box-sizing:border-box}[hidden]{display:none!important}html,body{max-width:100%;overflow-x:hidden}body{margin:0}.appbar{height:64px;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;padding:0 24px;gap:12px;background:#fff;position:sticky;top:0;z-index:5}.brand{font-size:21px;color:#3c4043}.plane{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--light-blue);color:var(--blue);margin-right:8px}.app-meta{margin-left:auto;color:var(--muted);font-size:14px}main{max-width:1240px;margin:auto;padding:34px 22px 60px}.hero{text-align:center;padding:12px 0 24px}.hero h1{font-size:32px;font-weight:500;margin:0 0 8px}.muted{color:var(--muted);line-height:1.55}.panel,.card{background:#fff;border:1px solid var(--border);border-radius:16px}.panel{padding:20px;margin:18px 0}.search-panel{box-shadow:0 2px 8px #3c40431f}.section-title{font-size:18px;font-weight:500;margin:0 0 16px}.controls{display:flex;flex-wrap:wrap;gap:12px;align-items:end}#scan{display:grid;grid-template-columns:repeat(3,minmax(140px,1fr)) auto minmax(80px,.5fr);gap:12px;align-items:start}#scan>label,#scan>.airline-field{min-width:0}#scan>.airline-field{grid-column:2/-1}#scan select,#scan input{width:100%;height:42px}#scan>button,#scan>#scanState{height:42px;margin-top:22px}#scan>#scanState{display:flex;align-items:center;white-space:nowrap}label{display:grid;gap:7px;font-size:12px;color:var(--muted)}input,select,button{font:inherit;border:1px solid var(--border);border-radius:8px;padding:11px 12px;background:#fff;color:#202124;min-height:42px}input:hover,select:hover{border-color:#9aa0a6}input:focus,select:focus{outline:2px solid #d2e3fc;border-color:var(--blue)}button,.link{cursor:pointer;background:var(--blue);color:#fff;border:1px solid var(--blue);font-weight:500}.link{display:inline-block;padding:8px 13px;border-radius:18px;text-decoration:none;white-space:nowrap}button:hover,.link:hover{background:#1765cc;box-shadow:0 1px 3px #3c40434d}button:disabled{opacity:.5;cursor:wait}#save,#load{background:#fff;color:var(--blue)}#save:hover,#load:hover{background:#f6fafe}.filter-panel{background:#f8f9fa;border-color:#f1f3f4}.top{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:14px 0 32px}.card{position:relative;overflow:hidden;padding:20px;transition:.15s;background:linear-gradient(145deg,#fff 55%,#f4f8ff)}.card:before{content:"";position:absolute;inset:0 0 auto;height:4px;background:linear-gradient(90deg,#1a73e8,#7baaf7)}.card:hover{box-shadow:0 5px 18px #3c404326;transform:translateY(-2px)}.card-head{display:flex;align-items:center;gap:8px}.rank{font-size:12px;font-weight:700;color:#174ea6;background:var(--light-blue);border-radius:14px;padding:5px 9px}.card-carrier{margin-left:auto;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card-route{display:flex;align-items:center;gap:10px;margin:18px 0 6px;font-size:21px;font-weight:600}.card-route .arrow{color:var(--blue)}.card-city{color:var(--muted);font-size:13px}.price{font-size:28px;font-weight:600;margin:15px 0 2px;color:#137333}.price-note{color:var(--muted);font-size:12px}.card-meta{display:flex;flex-wrap:wrap;gap:7px;margin:14px 0}.card-meta span{background:#f1f3f4;border-radius:12px;padding:5px 8px;font-size:12px}.card-times{border-top:1px solid #e8eaed;padding-top:12px;color:var(--muted);font-size:13px;line-height:1.65}.card .link{margin-top:13px}.route{font-weight:500;margin-bottom:8px}h2{font-size:20px;font-weight:500;margin:30px 0 12px}.table-wrap{padding:0;overflow:auto}.table-wrap table{min-width:1120px}table{width:100%;border-collapse:collapse;background:#fff}th,td{text-align:left;padding:14px 12px;border-bottom:1px solid #eceff1;vertical-align:middle}th{background:#f8f9fa;color:var(--muted);font-size:12px;font-weight:500;position:sticky;top:0}td{font-size:14px}tbody tr:hover{background:#f8faff}#status{white-space:pre-wrap;max-height:150px;overflow:auto;font:12px ui-monospace,monospace;color:var(--muted);margin:12px 0 0}.stats{margin-left:auto;color:var(--blue);align-self:center}.airline-field{border:0;padding:0;margin:0;min-width:360px}.airline-field legend{font-size:12px;color:var(--muted);margin-bottom:7px}.airline-choices{display:flex;flex-wrap:nowrap;align-items:center;gap:8px;height:42px;overflow-x:auto;overflow-y:hidden;scrollbar-width:thin}.airline-check{display:flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:18px;padding:7px 10px;height:36px;flex:0 0 auto;color:#3c4043;background:#fff;cursor:pointer}.airline-check:has(input:checked){background:var(--light-blue);border-color:#8ab4f8;color:#174ea6}#scan .airline-check input{width:16px;height:16px;min-height:0;margin:0;padding:0;accent-color:var(--blue)}.filter-panel{display:grid;grid-template-columns:repeat(2,minmax(145px,1fr)) minmax(80px,.55fr) minmax(120px,.8fr) minmax(145px,1fr) auto auto minmax(60px,.5fr);gap:14px;align-items:end}.filter-panel>label:first-child{grid-column:1}.filter-airline-field{grid-column:2/-1;border:0;padding:0;margin:0;min-width:0}.filter-airline-field legend{font-size:12px;color:var(--muted);margin-bottom:7px}.filter-airlines{display:flex;gap:7px;height:42px;align-items:center;overflow-x:auto;scrollbar-width:thin}.filter-airline-choice{display:flex;align-items:center;gap:6px;height:36px;flex:0 0 auto;padding:0 10px;border:1px solid var(--border);border-radius:18px;background:#fff;color:#3c4043;cursor:pointer}.airline-logo{width:22px;height:22px;object-fit:contain;border-radius:4px;background:#fff;padding:1px;vertical-align:middle}.logo-stack{display:inline-flex;align-items:center}.logo-stack .airline-logo+ .airline-logo{margin-left:-5px}.carrier-cell{display:flex;align-items:center;gap:7px;width:170px;min-width:0}.carrier-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}th:first-child,td:first-child{width:190px;max-width:190px}.filter-airline-choice:has(input:checked){background:var(--light-blue);border-color:#8ab4f8;color:#174ea6}.filter-airline-choice input{width:15px;height:15px;min-height:0;margin:0;padding:0;accent-color:var(--blue)}.filter-tools{display:contents}.filter-panel input,.filter-panel select,.filter-panel button{height:42px}.filter-tools .stats{height:42px;display:flex;align-items:center;justify-content:flex-end;align-self:end;white-space:nowrap}.storage-note{grid-column:1/-1;display:flex;gap:10px;align-items:flex-start;width:100%;background:#e8f0fe;color:#174ea6;border-radius:12px;padding:12px 15px;font-size:13px}@media(max-width:1000px){.filter-panel{grid-template-columns:repeat(2,minmax(0,1fr))}.filter-airline-field{grid-column:2/-1}.filter-tools .stats{justify-content:flex-start}}@media(max-width:1100px){#scan{grid-template-columns:repeat(2,minmax(0,1fr))}#scan>.airline-field{grid-column:1/-1}#scan>button,#scan>#scanState{margin-top:0}}@media(max-width:760px){.appbar{padding:0 16px}.app-meta{display:none}main{padding:20px 12px 48px}.hero{padding-top:4px}.hero h1{font-size:25px}.panel{padding:16px;border-radius:12px}#scan{grid-template-columns:minmax(0,1fr)}#scan>.airline-field{grid-column:auto}#scan>button{width:100%}#scan>#scanState{height:auto;min-height:24px}.top{grid-template-columns:1fr}.filter-panel{grid-template-columns:minmax(0,1fr)}.filter-panel>label:first-child,.filter-airline-field{grid-column:auto}.filter-tools{display:contents}.filter-tools>*{min-width:0}.filter-tools button{width:100%}.filter-tools .stats,.storage-note{grid-column:auto;margin:0}.table-wrap{width:100%;max-width:100%;min-width:0;overflow-x:auto;-webkit-overflow-scrolling:touch}.times{display:none}}
  </style>
</head>
<body>
<header class="appbar"><div class="brand"><span class="plane">✈</span>航班探索</div><div class="app-meta">TPE 出發 · 2 位成人 · TWD</div></header>
<main>
  <section class="hero"><h1>尋找適合你的歐洲航班</h1><div class="muted">比較中國籍航空行程，快速找出更便宜的日期<br><span id="updatedAt"></span></div></section>

  <section id="searchPanel" class="panel search-panel" hidden>
    <div class="section-title">搜尋航班</div>
    <form id="scan" class="controls">
      <label>目的地<select name="destination" required></select></label>
      <fieldset class="airline-field"><legend>有飛往此城市的中國籍航空（預設全選）</legend><div id="airlineChoices" class="airline-choices"></div></fieldset>
      <label>出發日從<input name="from" type="date" value="2026-10-01" required></label>
      <label>到<input name="to" type="date" value="2026-10-31" required></label>
      <label>天數<input name="days" value="8,9,10" pattern="[0-9, ]+" required></label>
      <button>執行搜尋</button>
      <span id="scanState" class="muted"></span>
    </form>
    <pre id="status"></pre>
  </section>

  <section class="panel filter-panel" aria-label="篩選與排序">
    <label>1. 目的地<select id="destination"><option value="">全部國家／目的地</option></select></label>
    <fieldset class="filter-airline-field"><legend>2. 航空公司（預設全選）</legend><div id="filterAirlines" class="filter-airlines"></div></fieldset>
    <label>3. 出發日從（選填）<input id="from" type="date"></label>
    <label>到（選填）<input id="to" type="date"></label>
    <div class="filter-tools">
      <label>天數<select id="days"><option value="">全部</option><option>8</option><option>9</option><option>10</option></select></label>
      <label>最高總價<input id="max" type="number" min="0" step="1000" placeholder="不限"></label>
      <label>排序<select id="sort"><option value="price">價格：低到高</option><option value="priceDesc">價格：高到低</option><option value="date">出發日：早到晚</option><option value="dateDesc">出發日：晚到早</option><option value="days">天數：短到長</option></select></label>
      <button id="save" type="button">儲存目前結果</button><button id="load" type="button">讀取結果</button><input id="file" type="file" accept="application/json,.json" hidden>
      <strong id="count" class="stats"></strong>
    </div>
    <div class="storage-note">ⓘ 先選目的地，再勾選航空公司；日期留空代表不限日期。</div>
  </section>

  <h2>最便宜前三名</h2><section id="top" class="top"></section>
  <h2>全部結果</h2>
  <div class="panel table-wrap"><table>
    <thead><tr><th>航空公司</th><th>航線</th><th>日期</th><th>天數</th><th>兩人總價</th><th class="times">去程</th><th>去程時長</th><th class="times">回程</th><th>回程時長</th><th>合計時長</th><th>Google Flights</th></tr></thead>
    <tbody id="rows"></tbody>
  </table></div>
</main>
<script>
const names={AMS:'阿姆斯特丹',ATH:'雅典',BCN:'巴塞隆納',BEG:'貝爾格勒',BER:'柏林',BRU:'布魯塞爾',BUD:'布達佩斯',CDG:'巴黎',CPH:'哥本哈根',DUB:'都柏林',EDI:'愛丁堡',FCO:'羅馬',FRA:'法蘭克福',GVA:'日內瓦',HEL:'赫爾辛基',IST:'伊斯坦堡',LED:'聖彼得堡',LGW:'倫敦蓋威克',LHR:'倫敦希斯洛',MAD:'馬德里',MAN:'曼徹斯特',MXP:'米蘭',MUC:'慕尼黑',OSL:'奧斯陸',SVO:'莫斯科',ARN:'斯德哥爾摩',VCE:'威尼斯',VIE:'維也納',WAW:'華沙'};
const destinationsByCountry={法國:['CDG'],德國:['BER','FRA','MUC'],英國:['EDI','LGW','LHR','MAN'],義大利:['FCO','MXP','VCE'],西班牙:['BCN','MAD'],荷蘭:['AMS'],瑞士:['GVA'],奧地利:['VIE'],比利時:['BRU'],丹麥:['CPH'],芬蘭:['HEL'],瑞典:['ARN'],挪威:['OSL'],愛爾蘭:['DUB'],希臘:['ATH'],匈牙利:['BUD'],波蘭:['WAW'],塞爾維亞:['BEG'],土耳其:['IST'],俄羅斯:['LED','SVO']};
const airlines={CZ:'中國南方航空',CA:'中國國際航空',HU:'海南航空',MF:'廈門航空','3U':'四川航空',HO:'吉祥航空',ZH:'深圳航空'};
const destinationsByAirline={
  CZ:['AMS','BEG','BUD','CDG','FRA','HEL','IST','LGW','LHR','MAD','MXP','SVO'],
  CA:['ATH','BCN','BRU','BUD','CDG','CPH','FCO','FRA','GVA','LGW','LHR','MAD','MXP','MUC','SVO','ARN','VCE','VIE','WAW'],
  HU:['BEG','BER','BRU','BUD','CDG','DUB','EDI','FCO','LED','MAN','MXP','OSL','SVO','VIE'],
  MF:['AMS','BER','CDG'],
  '3U':['FCO','IST','MAD','SVO'],
  HO:['ATH','BRU','HEL','MAN','MXP'],
  ZH:['BCN','LHR']
};
const airlineLabel = codes => codes.split('+').map(code=>airlines[code]||code).join(' + ');
const money = n => new Intl.NumberFormat('zh-TW',{style:'currency',currency:'TWD',maximumFractionDigits:0}).format(n);
const short = d => `${d.slice(5).replace('-','/')}（${new Intl.DateTimeFormat('zh-TW',{weekday:'short',timeZone:'UTC'}).format(new Date(`${d}T00:00:00Z`))}）`;
const duration = minutes => minutes ? `${Math.floor(minutes/60)} 小時 ${minutes%60 ? `${minutes%60} 分鐘` : ''}`.trim() : '—';
const time24=value=>String(value).replace(/(凌晨|清晨|上午|中午|下午|傍晚|晚上|午夜)(\d{1,2}):(\d{2})/g,(_,period,h,m)=>{let hour=Number(h);if(['中午','下午','傍晚','晚上'].includes(period)&&hour<12)hour+=12;if(['凌晨','清晨','上午','午夜'].includes(period)&&hour===12)hour=0;return `${String(hour).padStart(2,'0')}:${m}`});
const esc = value => String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const carrierCodes={'中華航空':'CI','中國南方航空':'CZ','中國國際航空':'CA','海南航空':'HU','廈門航空':'MF','四川航空':'3U','吉祥航空':'HO','深圳航空':'ZH'};
const logoHtml=name=>`<span class="logo-stack">${Object.entries(carrierCodes).filter(([carrier])=>name?.includes(carrier)).map(([,code])=>`<img class="airline-logo" src="https://www.gstatic.com/flights/airline_logos/70px/${code}.png" alt="" onerror="this.style.display='none'">`).join('')}</span>`;
let all=[], shown=[], activeAirlines=[], pendingDestination='';

function render(){
  const days=document.querySelector('#days').value,max=Number(document.querySelector('#max').value)||Infinity;
  const from=document.querySelector('#from').value,to=document.querySelector('#to').value,sort=document.querySelector('#sort').value,destination=document.querySelector('#destination').value;
  const selectedCarriers=new Set([...document.querySelectorAll('#filterAirlines input:checked')].map(x=>x.value));
  shown=all.filter(x=>(!activeAirlines.length||activeAirlines.includes(x.airline))&&selectedCarriers.has(x.carrier)&&(!destination||x.destination===destination)&&(!days||x.days==days)&&x.total_twd<=max&&(!from||x.departure>=from)&&(!to||x.departure<=to));
  shown.sort((a,b)=>sort==='price'?a.total_twd-b.total_twd:sort==='priceDesc'?b.total_twd-a.total_twd:sort==='date'?a.departure.localeCompare(b.departure):sort==='dateDesc'?b.departure.localeCompare(a.departure):a.days-b.days);
  document.querySelector('#count').textContent=`${shown.length} 筆`;
  document.querySelector('#top').innerHTML=shown.slice().sort((a,b)=>a.total_twd-b.total_twd).slice(0,3).map((x,i)=>`<article class="card"><div class="card-head"><span class="rank">第 ${i+1} 名</span><span class="card-carrier">${logoHtml(x.carrier)} ${esc(x.carrier)}</span></div><div class="card-route"><span>${esc(x.origin)}</span><span class="arrow">→</span><span>${esc(x.destination)}</span></div><div class="card-city">${esc(names[x.destination]||x.destination)} · ${esc(countryFor(x.destination))}</div><div class="price">${money(x.total_twd)}</div><div class="price-note">2 位成人來回 · 平均每人 ${money(x.total_twd/2)}</div><div class="card-meta"><span>${x.days} 天</span><span>${short(x.departure)}–${short(x.return)}</span><span>合計 ${duration(x.total_minutes)}</span></div><div class="card-times">去程 ${esc(time24(x.outbound_time))} · ${esc(x.outbound_duration||'—')}<br>回程 ${esc(time24(x.return_time))} · ${esc(x.return_duration||'—')}</div><a class="link" href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">查看 Google Flights</a></article>`).join('')||'<p class="muted">沒有符合條件的結果</p>';
  document.querySelector('#rows').innerHTML=shown.map(x=>`<tr><td><span class="carrier-cell" title="${esc(x.carrier)}">${logoHtml(x.carrier)}<span class="carrier-name">${esc(x.carrier)}</span></span></td><td>${esc(x.origin)} → ${esc(x.destination)}</td><td>${short(x.departure)}–${short(x.return)}</td><td>${x.days} 天</td><td><strong>${money(x.total_twd)}</strong></td><td class="times">${esc(time24(x.outbound_time))}</td><td>${esc(x.outbound_duration||'—')}</td><td class="times">${esc(time24(x.return_time))}</td><td>${esc(x.return_duration||'—')}</td><td><strong>${duration(x.total_minutes)}</strong></td><td><a class="link" href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">開啟</a></td></tr>`).join('');
}
function updateSearchAirlines(){const destination=document.querySelector('[name=destination]').value,codes=Object.keys(destinationsByAirline).filter(x=>destinationsByAirline[x].includes(destination));document.querySelector('#airlineChoices').innerHTML=codes.map(x=>`<label class="airline-check"><input type="checkbox" name="airlines" value="${x}" checked><img class="airline-logo" src="https://www.gstatic.com/flights/airline_logos/70px/${x}.png" alt="">${airlines[x]}（${x}）</label>`).join('')}
function countryOptions(codes){const available=new Set(codes);return Object.entries(destinationsByCountry).map(([country,airports])=>{const options=airports.filter(x=>available.has(x)).map(x=>`<option value="${x}">${names[x]}（${x}）</option>`).join('');return options?`<optgroup label="${country}">${options}</optgroup>`:''}).join('')}
const countryFor=code=>Object.entries(destinationsByCountry).find(([,airports])=>airports.includes(code))?.[0]||'';
function updateFilterDestinations(selected=''){const select=document.querySelector('#destination'),codes=[...new Set(all.map(x=>x.destination))];select.innerHTML='<option value="">全部國家／目的地</option>'+countryOptions(codes);select.value=codes.includes(selected)?selected:''}
function updateFilterAirlines(){const destination=document.querySelector('#destination').value,carriers=[...new Set(all.filter(x=>!destination||x.destination===destination).map(x=>x.carrier))].sort((a,b)=>a.localeCompare(b,'zh-Hant'));document.querySelector('#filterAirlines').innerHTML=carriers.map(carrier=>`<label class="filter-airline-choice"><input type="checkbox" value="${esc(carrier)}" checked>${logoHtml(carrier)}${esc(carrier)}</label>`).join('')}
async function load(){const data=await fetch('./data/results.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(`HTTP ${r.status}`);return r.json()}),selectedDestination=pendingDestination||document.querySelector('#destination').value;all=data.results;document.querySelector('#updatedAt').textContent=data.generatedAt?`價格更新：${new Intl.DateTimeFormat('zh-TW',{dateStyle:'medium',timeStyle:'short',timeZone:'Asia/Taipei'}).format(new Date(data.generatedAt))}`:'';updateFilterDestinations(selectedDestination);pendingDestination='';updateFilterAirlines();render()}
document.querySelector('#destination').addEventListener('input',()=>{updateFilterAirlines();render()});
document.querySelector('#filterAirlines').addEventListener('change',render);
document.querySelectorAll('#days,#max,#from,#to,#sort').forEach(x=>x.addEventListener('input',render));
const citySelect=document.querySelector('[name=destination]'),searchDestinations=[...new Set(Object.values(destinationsByAirline).flat())];citySelect.innerHTML=countryOptions(searchDestinations);citySelect.value='CDG';citySelect.addEventListener('change',updateSearchAirlines);updateSearchAirlines();
document.querySelector('#save').addEventListener('click',()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({savedAt:new Date().toISOString(),results:shown},null,2)],{type:'application/json'}));a.download=`flights-${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(a.href)});
document.querySelector('#load').addEventListener('click',()=>document.querySelector('#file').click());
document.querySelector('#file').addEventListener('change',async event=>{try{const data=JSON.parse(await event.target.files[0].text()),rows=Array.isArray(data)?data:data.results;if(!Array.isArray(rows)||rows.some(x=>!/^[A-Z0-9]{2}(?:\+[A-Z0-9]{2})*$/.test(x.airline)||!/^\w{3}$/.test(x.origin)||!/^\w{3}$/.test(x.destination)||!/^\d{4}-\d{2}-\d{2}$/.test(x.departure)||!/^\d{4}-\d{2}-\d{2}$/.test(x.return)||!Number.isInteger(x.days)||!Number.isFinite(x.total_twd)||typeof x.outbound_time!=='string'||typeof x.return_time!=='string'||!x.url?.startsWith('https://www.google.com/travel/flights/')))throw Error();all=rows;updateFilterDestinations();updateFilterAirlines();render()}catch{alert('無法讀取：檔案格式不正確')}finally{event.target.value=''}});
document.querySelector('#scan').addEventListener('submit',async event=>{
  event.preventDefault();const form=new FormData(event.target),button=event.target.querySelector('button');
  const days=form.get('days').split(',').map(x=>Number(x.trim())).filter(Boolean),destination=form.get('destination'),selectedAirlines=form.getAll('airlines');if(!selectedAirlines.length){alert('請至少選擇一家航空公司');return}button.disabled=true;activeAirlines=[selectedAirlines.slice().sort().join('+')];pendingDestination=destination;
