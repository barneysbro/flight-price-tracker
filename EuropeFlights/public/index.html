r(--muted);font-size:13px;line-height:1.65}.card .link{margin-top:13px}.ticket{display:grid;grid-template-columns:minmax(0,1fr) 280px;padding:0;background:#fff}.ticket-main{padding:24px 26px}.ticket-header{display:flex;align-items:center;gap:12px;margin-bottom:22px}.ticket-title{font-size:12px;font-weight:800;letter-spacing:1.2px;color:#174ea6}.ticket-airline{margin-left:auto;display:flex;align-items:center;gap:7px;color:var(--muted);font-size:13px}.ticket-route{display:grid;grid-template-columns:auto minmax(100px,1fr) auto;align-items:center;gap:18px}.airport-code{font-size:34px;font-weight:700;letter-spacing:1px}.airport-city{color:var(--muted);font-size:13px;margin-top:3px}.flight-line{position:relative;height:2px;background:#a8c7fa}.flight-line:before,.flight-line:after{content:"";position:absolute;top:50%;width:7px;height:7px;border:2px solid var(--blue);border-radius:50%;background:#fff;transform:translateY(-50%)}.flight-line:before{left:0}.flight-line:after{right:0}.flight-line span{position:absolute;left:50%;top:50%;padding:0 8px;background:#fff;color:var(--blue);font-size:20px;transform:translate(-50%,-55%)}.ticket-details{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:24px;padding-top:17px;border-top:1px solid #e8eaed}.ticket-label{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.5px}.ticket-value{font-size:14px;font-weight:600;margin-top:5px;line-height:1.45}.ticket-stub{position:relative;display:flex;flex-direction:column;justify-content:center;padding:24px;background:#f4f8ff;border-left:2px dashed #b6c8e6}.ticket-stub:before,.ticket-stub:after{content:"";position:absolute;left:-11px;width:20px;height:20px;border-radius:50%;background:#fff}.ticket-stub:before{top:-10px}.ticket-stub:after{bottom:-10px}.ticket-price{font-size:30px;font-weight:700;color:#137333;margin:7px 0 3px}.ticket-note{color:var(--muted);font-size:12px;line-height:1.5}.barcode{height:34px;margin-top:17px;background:repeating-linear-gradient(90deg,#3c4043 0 2px,transparent 2px 5px,#3c4043 5px 6px,transparent 6px 10px);opacity:.65}.route{font-weight:500;margin-bottom:8px}h2{font-size:20px;font-weight:500;margin:30px 0 12px}.table-wrap{padding:0;overflow:auto}.table-wrap table{min-width:1120px}table{width:100%;border-collapse:collapse;background:#fff}th,td{text-align:left;padding:14px 12px;border-bottom:1px solid #eceff1;vertical-align:middle}th{background:#f8f9fa;color:var(--muted);font-size:12px;font-weight:500;position:sticky;top:0}td{font-size:14px}tbody tr:hover{background:#f8faff}#status{white-space:pre-wrap;max-height:150px;overflow:auto;font:12px ui-monospace,monospace;color:var(--muted);margin:12px 0 0}.stats{margin-left:auto;color:var(--blue);align-self:center}.airline-field{border:0;padding:0;margin:0;min-width:360px}.airline-field legend{font-size:12px;color:var(--muted);margin-bottom:7px}.airline-choices{display:flex;flex-wrap:nowrap;align-items:center;gap:8px;height:42px;overflow-x:auto;overflow-y:hidden;scrollbar-width:thin}.airline-check{display:flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:18px;padding:7px 10px;height:36px;flex:0 0 auto;color:#3c4043;background:#fff;cursor:pointer}.airline-check:has(input:checked){background:var(--light-blue);border-color:#8ab4f8;color:#174ea6}#scan .airline-check input{width:16px;height:16px;min-height:0;margin:0;padding:0;accent-color:var(--blue)}.filter-panel{display:grid;grid-template-columns:repeat(2,minmax(145px,1fr)) minmax(80px,.55fr) minmax(120px,.8fr) minmax(145px,1fr) auto auto minmax(60px,.5fr);gap:14px;align-items:end}.filter-panel>label:first-child{grid-column:1}.filter-airline-field{grid-column:2/-1;border:0;padding:0;margin:0;min-width:0}.filter-airline-field legend{font-size:12px;color:var(--muted);margin-bottom:7px}.filter-airlines{display:flex;gap:7px;height:42px;align-items:center;overflow-x:auto;scrollbar-width:thin}.filter-airline-choice{display:flex;align-items:center;gap:6px;height:36px;flex:0 0 auto;padding:0 10px;border:1px solid var(--border);border-radius:18px;background:#fff;color:#3c4043;cursor:pointer}.airline-logo{width:22px;height:22px;object-fit:contain;border-radius:4px;background:#fff;padding:1px;vertical-align:middle}.logo-stack{display:inline-flex;align-items:center}.logo-stack .airline-logo+ .airline-logo{margin-left:-5px}.carrier-cell{display:flex;align-items:center;gap:7px;width:170px;min-width:0}.carrier-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}th:first-child,td:first-child{width:190px;max-width:190px}.filter-airline-choice:has(input:checked){background:var(--light-blue);border-color:#8ab4f8;color:#174ea6}.filter-airline-choice input{width:15px;height:15px;min-height:0;margin:0;padding:0;accent-color:var(--blue)}.filter-tools{display:contents}.filter-panel input,.filter-panel select,.filter-panel button{height:42px}.filter-tools .stats{height:42px;display:flex;align-items:center;justify-content:flex-end;align-self:end;white-space:nowrap}.storage-note{grid-column:1/-1;display:flex;gap:10px;align-items:flex-start;width:100%;background:#e8f0fe;color:#174ea6;border-radius:12px;padding:12px 15px;font-size:13px}@media(max-width:1000px){.filter-panel{grid-template-columns:repeat(2,minmax(0,1fr))}.filter-airline-field{grid-column:2/-1}.filter-tools .stats{justify-content:flex-start}}@media(max-width:1100px){#scan{grid-template-columns:repeat(2,minmax(0,1fr))}#scan>.airline-field{grid-column:1/-1}#scan>button,#scan>#scanState{margin-top:0}}@media(max-width:760px){.ticket{grid-template-columns:1fr}.ticket-main{padding:20px}.ticket-stub{border-left:0;border-top:2px dashed #b6c8e6}.ticket-stub:before,.ticket-stub:after{top:-11px;bottom:auto}.ticket-stub:before{left:-10px}.ticket-stub:after{left:auto;right:-10px}.ticket-details{grid-template-columns:1fr}.airport-code{font-size:28px}.ticket-route{gap:12px}.ticket-airline{max-width:55%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.appbar{padding:0 16px}.app-meta{display:none}main{padding:20px 12px 48px}.hero{padding-top:4px}.hero h1{font-size:25px}.panel{padding:16px;border-radius:12px}#scan{grid-template-columns:minmax(0,1fr)}#scan>.airline-field{grid-column:auto}#scan>button{width:100%}#scan>#scanState{height:auto;min-height:24px}.top{grid-template-columns:1fr}.filter-panel{grid-template-columns:minmax(0,1fr)}.filter-panel>label:first-child,.filter-airline-field{grid-column:auto}.filter-tools{display:contents}.filter-tools>*{min-width:0}.filter-tools button{width:100%}.filter-tools .stats,.storage-note{grid-column:auto;margin:0}.table-wrap{width:100%;max-width:100%;min-width:0;overflow-x:auto;-webkit-overflow-scrolling:touch}.times{display:none}}
    .ranking-filters{display:grid;grid-template-columns:repeat(7,minmax(120px,1fr));gap:12px;align-items:end;background:#f8f9fa}.ranking-filters label{min-width:0}.ranking-filters select,.ranking-filters input{width:100%;min-width:0;max-width:100%;height:42px}.ranking-filters .quick-months{background:#fff;color:var(--blue)}.ranking-filters .apply{height:42px}.ranking-actions{grid-column:1/-1;display:flex;align-items:center;gap:10px}.ranking-actions button{min-height:36px;padding:7px 11px;background:#fff;color:var(--blue)}.ranking-actions .stats{margin-left:auto}.month-heading{display:flex;align-items:end;gap:12px;margin:30px 0 12px}.month-heading h2{margin:0}.month-heading span{color:var(--muted);font-size:13px}.month-board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(320px,1fr);gap:14px;overflow-x:auto;padding:2px 2px 16px;scroll-snap-type:x proximity}.month-column{display:flex;flex-direction:column;gap:12px;scroll-snap-align:start}.month-column-header{display:flex;align-items:baseline;gap:8px;padding:0 4px}.month-column-header strong{font-size:22px}.month-column-header span{color:var(--muted);font-size:13px}.month-flight{padding:16px;border:1px solid var(--border);border-radius:14px;background:#fff;box-shadow:0 1px 3px #3c40431a}.month-flight-head{display:flex;align-items:center;gap:8px}.month-flight-rank{padding:4px 8px;border-radius:12px;background:var(--light-blue);color:#174ea6;font-size:12px;font-weight:700}.month-flight-carrier{display:flex;align-items:center;gap:6px;min-width:0;margin-left:auto;font-size:13px}.month-flight-carrier>span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.month-flight-route{margin:14px 0 5px;font-size:20px;font-weight:700}.month-flight-route span{padding:0 8px;color:var(--blue)}.month-flight-place{color:var(--muted);font-size:12px}.month-flight-date{margin:13px 0 9px;font-weight:600}.month-flight-summary{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px;border-radius:10px;background:#f4f8ff}.month-flight-summary small,.month-flight-leg small{display:block;color:var(--muted);font-size:11px}.month-flight-summary strong{display:block;margin-top:3px;color:#137333;font-size:19px}.month-flight-summary div:last-child strong{color:#202124;font-size:15px}.month-flight-legs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.month-flight-leg{padding:9px;border:1px solid #e8eaed;border-radius:9px;font-size:12px;line-height:1.5}.month-flight-link{display:block;margin-top:12px;padding:9px;border-radius:18px;background:var(--blue);color:#fff;text-align:center;text-decoration:none;font-weight:600}.month-more{width:100%;background:#fff;color:var(--blue)}.month-empty{padding:28px 15px;border:1px dashed var(--border);border-radius:14px;color:var(--muted);text-align:center}.filter-error{grid-column:1/-1;color:#b3261e;font-size:13px}@media(max-width:1000px){.ranking-filters{grid-template-columns:repeat(4,minmax(0,1fr))}}@media(max-width:760px){.ranking-filters{grid-template-columns:repeat(2,minmax(0,1fr))}.ranking-actions{flex-wrap:wrap}.ranking-actions .stats{width:100%;margin:0}.month-board{grid-auto-columns:minmax(290px,86vw)}}

<body>
<header class="appbar"><div class="brand"><span class="plane">✈</span>歐洲航班</div><div class="meta"><span>來回</span><span>♙ 2 位成人</span><span>經濟艙</span></div></header>
<main>
  <section class="hero"><h1>尋找適合你的歐洲航班</h1><div class="muted">比較中國籍航空行程，快速找出更便宜的日期<br><span id="updatedAt"></span></div></section>

  <section id="searchPanel" class="panel search-panel" hidden>
    <div class="local-mode-header"><span class="local-mode-badge">LOCAL</span><div><strong>本機搜尋工具</strong><small>這個藍色區塊只會出現在本機版，不會顯示於 GitHub Pages</small></div></div>
    <form id="scan" class="controls">
      <label>目的地<select name="destination" required></select></label>
      <fieldset class="airline-field"><legend>有飛往此城市的中國籍航空（預設全選）</legend><div id="airlineChoices" class="airline-choices"></div></fieldset>
      <label>出發日從<input name="from" type="date" value="2026-10-01" required></label>
      <label>到<input name="to" type="date" value="2026-10-31" required></label>
      <label>天數<input name="days" value="8,9,10" pattern="[0-9, ]+" required></label>
      <button>執行搜尋</button>
      <span id="scanState" class="muted"></span>
    </form>
    <pre id="status"></pre>
    <section id="failurePanel" class="flight-failures" hidden><div><strong>未完成 <span id="failureCount">0</span> 筆</strong><span>失敗會保留，可從中斷處繼續。</span></div><button id="retryFailures" type="button">從失敗處繼續</button><details><summary>查看最近失敗</summary><div id="failureList"></div></details></section>
  </section>

  <section class="panel ranking-filters" aria-label="篩選與排名">
    <button id="quickMonths" class="quick-months" type="button">9–12 月</button>
    <label>開始月份<input id="monthFrom" type="month"></label>
    <label>結束月份<input id="monthTo" type="month"></label>
    <label>國家<select id="country"><option value="">全部國家</option></select></label>
    <label>城市／機場<select id="destination"><option value="">全部城市／機場</option></select></label>
    <label>航空公司<select id="carrier"><option value="">全部航空公司</option></select></label>
    <label>排名方式<select id="ranking"><option value="price">價格最低</option><option value="duration">總飛行時間最短</option></select></label>
    <button id="applyFilters" class="apply" type="button">套用篩選</button>
    <div id="filterError" class="filter-error" hidden></div>
    <div class="ranking-actions"><button id="save" type="button">儲存篩選結果</button><button id="load" type="button">讀取結果</button><input id="file" type="file" accept="application/json,.json" hidden><strong id="count" class="stats"></strong></div>
  </section>

  <div class="month-heading"><h2>每月前三名</h2><span>月份可左右滑動；點擊展開可查看該月全部航段</span></div>
  <section id="monthBoard" class="month-board" aria-live="polite"></section>
</main>
<script src="../shared/flight-ui.js"></script>
<script>
const names={AMS:'阿姆斯特丹',ATH:'雅典',BCN:'巴塞隆納',BEG:'貝爾格勒',BER:'柏林',BRU:'布魯塞爾',BUD:'布達佩斯',CDG:'巴黎',CPH:'哥本哈根',DUB:'都柏林',EDI:'愛丁堡',FCO:'羅馬',FRA:'法蘭克福',GVA:'日內瓦',HEL:'赫爾辛基',IST:'伊斯坦堡',LED:'聖彼得堡',LGW:'倫敦蓋威克',LHR:'倫敦希斯洛',MAD:'馬德里',MAN:'曼徹斯特',MXP:'米蘭',MUC:'慕尼黑',OSL:'奧斯陸',SVO:'莫斯科',ARN:'斯德哥爾摩',VCE:'威尼斯',VIE:'維也納',WAW:'華沙'};
const destinationsByCountry={法國:['CDG'],德國:['BER','FRA','MUC'],英國:['EDI','LGW','LHR','MAN'],義大利:['FCO','MXP','VCE'],西班牙:['BCN','MAD'],荷蘭:['AMS'],瑞士:['GVA'],奧地利:['VIE'],比利時:['BRU'],丹麥:['CPH'],芬蘭:['HEL'],瑞典:['ARN'],挪威:['OSL'],愛爾蘭:['DUB'],希臘:['ATH'],匈牙利:['BUD'],波蘭:['WAW'],塞爾維亞:['BEG'],土耳其:['IST'],俄羅斯:['LED','SVO']};
const airlines={CZ:'中國南方航空',CA:'中國國際航空',HU:'海南航空',MF:'廈門航空','3U':'四川航空',HO:'吉祥航空',ZH:'深圳航空'};
const destinationsByAirline={
  CZ:['AMS','BEG','BUD','CDG','FRA','HEL','IST','LGW','LHR','MAD','MXP','SVO'],
  CA:['ATH','BCN','BRU','BUD','CDG','CPH','FCO','FRA','GVA','LGW','LHR','MXP','MUC','SVO','ARN','VCE','VIE','WAW'],
  HU:['BEG','BER','BRU','BUD','CDG','DUB','EDI','FCO','LED','MAN','MXP','OSL','SVO','VIE'],
  MF:['AMS','BER','CDG'],
  '3U':['FCO','IST','SVO'],
  HO:['ATH','BRU','HEL','MAN','MXP'],
  ZH:['BCN','LHR']
};
const airlineLabel = codes => codes.split('+').map(code=>airlines[code]||code).join(' + ');
const money = n => new Intl.NumberFormat('zh-TW',{style:'currency',currency:'TWD',maximumFractionDigits:0}).format(n);
const short = d => `${d.slice(5).replace('-','/')}（${new Intl.DateTimeFormat('zh-TW',{weekday:'short',timeZone:'UTC'}).format(new Date(`${d}T00:00:00Z`))}）`;
const duration = minutes => minutes ? `${Math.floor(minutes/60)} 小時 ${minutes%60 ? `${minutes%60} 分鐘` : ''}`.trim() : '—';
const time24=value=>String(value).replace(/(凌晨|清晨|上午|中午|下午|傍晚|晚上|午夜)(\d{1,2}):(\d{2})/g,(_,period,h,m)=>{let hour=Number(h);if(['中午','下午','傍晚','晚上'].includes(period)&&hour<12)hour+=12;if(['凌晨','清晨','上午','午夜'].includes(period)&&hour===12)hour=0;return `${String(hour).padStart(2,'0')}:${m}`});
const esc = value => String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const carrierCodes={'中華航空':'CI','中國南方航空':'CZ','中國國際航空':'CA','海南航空':'HU','廈門航空':'MF','四川航空':'3U','吉祥航空':'HO','深圳航空':'ZH'};
const logoHtml=name=>`<span class="logo-stack">${Object.entries(carrierCodes).filter(([carrier])=>name?.includes(carrier)).map(([,code])=>`<img class="airline-logo" src="https://www.gstatic.com/flights/airline_logos/70px/${code}.png" alt="" onerror="this.style.display='none'">`).join('')}</span>`;
let all=[],shown=[],pendingDestination='',initialized=false,applied={},expanded=new Set();

function updateSearchAirlines(){const destination=document.querySelector('[name=destination]').value,codes=Object.keys(destinationsByAirline).filter(x=>destinationsByAirline[x].includes(destination));document.querySelector('#airlineChoices').innerHTML=codes.map(x=>`<label class="airline-check"><input type="checkbox" name="airlines" value="${x}" checked><img class="airline-logo" src="https://www.gstatic.com/flights/airline_logos/70px/${x}.png" alt="">${airlines[x]}（${x}）</label>`).join('')}
function countryOptions(codes){const available=new Set(codes);return Object.entries(destinationsByCountry).map(([country,airports])=>{const options=airports.filter(x=>available.has(x)).map(x=>`<option value="${x}">${names[x]}（${x}）</option>`).join('');return options?`<optgroup label="${country}">${options}</optgroup>`:''}).join('')}
const countryFor=code=>Object.entries(destinationsByCountry).find(([,airports])=>airports.includes(code))?.[0]||'';
const carrierName=value=>Object.keys(carrierCodes).filter(name=>value?.includes(name)).join('、')||value;
function monthKeys(from,to){const months=[];let [year,month]=from.split('-').map(Number);while(`${year}-${String(month).padStart(2,'0')}`<=to&&months.length<60){months.push(`${year}-${String(month).padStart(2,'0')}`);if(++month===13){month=1;year++}}return months}
function comparator(mode){return mode==='duration'?(a,b)=>a.total_minutes-b.total_minutes||a.total_twd-b.total_twd||a.departure.localeCompare(b.departure):(a,b)=>a.total_twd-b.total_twd||a.total_minutes-b.total_minutes||a.departure.localeCompare(b.departure)}
function uniqueFlights(rows){return [...new Map(rows.map(x=>[[x.destination,x.departure,x.return,carrierName(x.carrier),x.total_twd,x.outbound_time,x.return_time].join('|'),x])).values()]}
function flightCard(x,index){return `<article class="month-flight"><div class="month-flight-head"><span class="month-flight-rank">第 ${index+1} 名</span><span class="month-flight-carrier">${logoHtml(x.carrier)}<span>${esc(carrierName(x.carrier))}</span></span></div><div class="month-flight-route">${esc(x.origin)}<span>→</span>${esc(x.destination)}</div><div class="month-flight-place">台北 → ${esc(names[x.destination]||x.destination)} · ${esc(countryFor(x.destination))}</div><div class="month-flight-date">${short(x.departure)}－${short(x.return)} · ${x.days} 天</div><div class="month-flight-summary"><div><small>兩人來回總價</small><strong>${money(x.total_twd)}</strong></div><div><small>總飛行時間</small><strong>${duration(x.total_minutes)}</strong></div></div><div class="month-flight-legs"><div class="month-flight-leg"><small>去程</small>${esc(time24(x.outbound_time))}<br>${esc(x.outbound_duration||'—')}</div><div class="month-flight-leg"><small>回程</small>${esc(time24(x.return_time))}<br>${esc(x.return_duration||'—')}</div></div><a class="month-flight-link" href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">查看 Google Flights</a></article>`}
function render(){
  const months=monthKeys(applied.monthFrom,applied.monthTo),sort=comparator(applied.ranking);
  shown=uniqueFlights(all.filter(x=>x.departure.slice(0,7)>=applied.monthFrom&&x.departure.slice(0,7)<=applied.monthTo&&(!applied.country||countryFor(x.destination)===applied.country)&&(!applied.destination||x.destination===applied.destination)&&(!applied.carrier||x.carrier.includes(applied.carrier)))).sort(sort);
  document.querySelector('#count').textContent=`${shown.length} 筆符合條件`;
  document.querySelector('#monthBoard').innerHTML=months.map(key=>{const rows=shown.filter(x=>x.departure.startsWith(key)).sort(sort),visible=expanded.has(key)?rows:rows.slice(0,3),[year,month]=key.split('-');return `<section class="month-column"><div class="month-column-header"><strong>${Number(month)} 月</strong><span>${year} · ${rows.length} 筆</span></div>${visible.map(flightCard).join('')||'<div class="month-empty">這個月份沒有符合條件的航段</div>'}${rows.length>3?`<button class="month-more" type="button" data-month="${key}">${expanded.has(key)?'收合為前三名':`展開全部 ${rows.length} 筆`}</button>`:''}</section>`}).join('');
}
function updateCities(selected=''){const country=document.querySelector('#country').value,codes=[...new Set(all.filter(x=>!country||countryFor(x.destination)===country).map(x=>x.destination))].sort();const select=document.querySelector('#destination');select.innerHTML='<option value="">全部城市／機場</option>'+codes.map(x=>`<option value="${x}">${esc(names[x]||x)}（${x}）</option>`).join('');select.value=codes.includes(selected)?selected:''}
function populateFilters(selectedDestination=''){
  const country=document.querySelector('#country'),carrier=document.querySelector('#carrier'),oldCountry=country.value,oldCarrier=carrier.value,countries=[...new Set(all.map(x=>countryFor(x.destination)).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'zh-Hant')),carriers=Object.keys(carrierCodes).filter(name=>all.some(x=>x.carrier?.includes(name)));
  country.innerHTML='<option value="">全部國家</option>'+countries.map(x=>`<option>${esc(x)}</option>`).join('');country.value=countries.includes(oldCountry)?oldCountry:'';
  carrier.innerHTML='<option value="">全部航空公司</option>'+carriers.map(x=>`<option>${esc(x)}</option>`).join('');carrier.value=carriers.includes(oldCarrier)?oldCarrier:'';
  if(selectedDestination)country.value=countryFor(selectedDestination);updateCities(selectedDestination||document.querySelector('#destination').value);
  if(!document.querySelector('#monthFrom').value){const year=(all[0]?.departure||new Date().toISOString()).slice(0,4);document.querySelector('#monthFrom').value=`${year}-09`;document.querySelector('#monthTo').value=`${year}-12`}
}
function applyFilters(){const error=document.querySelector('#filterError'),monthFrom=document.querySelector('#monthFrom').value,monthTo=document.querySelector('#monthTo').value;if(!monthFrom||!monthTo||monthFrom>monthTo){error.textContent='請選擇有效的開始與結束月份';error.hidden=false;return false}error.hidden=true;applied={monthFrom,monthTo,country:document.querySelector('#country').value,destination:document.querySelector('#destination').value,carrier:document.querySelector('#carrier').value,ranking:document.querySelector('#ranking').value};expanded.clear();render();return true}
function renderFailures(failures){const panel=document.querySelector('#failurePanel');document.querySelector('#retryFailures').disabled=false;panel.hidden=!failures.length;document.querySelector('#failureCount').textContent=failures.length;document.querySelector('#failureList').innerHTML=failures.slice(-10).reverse().map(x=>`<div>${esc(x.airline)} · ${esc(x.destination)} · ${short(x.departure)} · ${x.days} 天<br><small>${esc(x.error)}</small></div>`).join('')}
async function load(){const data=await fetch('./data/results.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(`HTTP ${r.status}`);return r.json()});all=data.results;document.querySelector('#updatedAt').textContent=data.generatedAt?`價格更新：${FlightUI.formatUpdatedAt(data.generatedAt)}`:'';renderFailures(data.failures||[]);populateFilters(pendingDestination);if(!initialized||pendingDestination){applyFilters();initialized=true}else render();pendingDestination=''}
document.querySelector('#country').addEventListener('change',()=>updateCities());
document.querySelector('#quickMonths').addEventListener('click',()=>{const year=(document.querySelector('#monthFrom').value||all[0]?.departure||new Date().toISOString()).slice(0,4);document.querySelector('#monthFrom').value=`${year}-09`;document.querySelector('#monthTo').value=`${year}-12`});
document.querySelector('#applyFilters').addEventListener('click',applyFilters);
document.querySelector('#monthBoard').addEventListener('click',event=>{const month=event.target.dataset.month;if(!month)return;expanded.has(month)?expanded.delete(month):expanded.add(month);render()});
const citySelect=document.querySelector('[name=destination]'),searchDestinations=[...new Set(Object.values(destinationsByAirline).flat())];citySelect.innerHTML=countryOptions(searchDestinations);citySelect.value='CDG';citySelect.addEventListener('change',updateSearchAirlines);updateSearchAirlines();
document.querySelector('#save').addEventListener('click',()=>FlightUI.downloadResults(`flights-${new Date().toISOString().slice(0,10)}.json`,shown));
document.querySelector('#load').addEventListener('click',()=>document.querySelector('#file').click());
document.querySelector('#retryFailures').addEventListener('click',async()=>{const button=document.querySelector('#retryFailures');button.disabled=true;const response=await fetch('/api/retry-failures',{method:'POST'});if(!response.ok){alert((await response.json()).error);button.disabled=false;return}poll()});
document.querySelector('#file').addEventListener('change',async event=>{try{const data=JSON.parse(await event.target.files[0].text()),rows=Array.isArray(data)?data:data.results;if(!Array.isArray(rows)||rows.some(x=>!/^[A-Z0-9]{2}(?:\+[A-Z0-9]{2})*$/.test(x.airline)||!/^\w{3}$/.test(x.origin)||!/^\w{3}$/.test(x.destination)||!/^\d{4}-\d{2}-\d{2}$/.test(x.departure)||!/^\d{4}-\d{2}-\d{2}$/.test(x.return)||!Number.isInteger(x.days)||!Number.isFinite(x.total_twd)||typeof x.outbound_time!=='string'||typeof x.return_time!=='string'||!x.url?.startsWith('https://www.google.com/travel/flights/')))throw Error();all=rows;populateFilters();applyFilters()}catch{alert('無法讀取：檔案格式不正確')}finally{event.target.value=''}});
console.assert(monthKeys('2026-09','2026-12').join(',')==='2026-09,2026-10,2026-11,2026-12');
document.querySelector('#scan').addEventListener('submit',async event=>{
  event.preventDefault();const form=new FormData(event.target),button=event.target.querySelector('button');
  const days=form.get('days').split(',').map(x=>Number(x.trim())).filter(Boolean),destination=form.get('destination'),selectedAirlines=form.getAll('airlines');if(!selectedAirlines.length){alert('請至少選擇一家航空公司');return}button.disabled=true;pendingDestination=destination;
  const response=await fetch('/api/scan',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({from:form.get('from'),to:form.get('to'),days,destination,airlines:selectedAirlines})});
  if(!response.ok){alert((await response.json()).error);button.disabled=false;return} poll();
});
async function poll(){await FlightUI.pollLocal({panel:document.querySelector('#searchPanel'),state:document.querySelector('#scanState'),status:document.querySelector('#status'),button:document.querySelector('#scan button'),onComplete:load})}
console.assert(time24('下午5:50 – 清晨7:25+1')==='17:50 – 07:25+1');
load().catch(()=>document.querySelector('#updatedAt').textContent='目前無法載入價格資料');poll();
</script></body></html>
